<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ten years of the A1 Project & Processes Management Department — delivery, structure and quality, and the people behind all of it."
    />
    <meta name="theme-color" content="#f7f2e9" />
    <!-- The experience opens on the ivory hero. This inline rule is the very
         first style the parser sees, so the first painted frame is already
         the hero's background — no dark frame before React or WebGL start. -->
    <style>
      html,
      body,
      #root {
        background-color: #f7f2e9;
      }
    </style>
    <!-- Fonts: Sora (display/labels) + Inter (body). Preconnect + swap to minimize layout shift. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap"
    />
    <title>10 Years · Project & Processes Management Department · A1</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
